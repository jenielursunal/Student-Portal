
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-card">

            <div class="logo">SP</div>

            <h1>Student Portal</h1>
            <p class="subtitle">
                Welcome back! Please log in to your account.
            </p>

            <form action="#" method="get">

                <div class="form-group">
                    <label for="student-id">Student ID or Username</label>
                    <input
                        type="text"
                        id="student-id"
                        name="student_id"
                        placeholder="Enter your Student ID or Username"
                        required
                        minlength="3">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        minlength="6">
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" name="remember">
                        Remember Me
                    </label>

                    <a href="#forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn">Login</button>

            </form>

            <p class="switch-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </div>
    </div>

    <!-- FORGOT PASSWORD POPUP -->
    <div id="forgot-password" class="forgot-overlay">
        <div class="forgot-box">

            <a href="#" class="close-button" aria-label="Close">&times;</a>

            <div class="logo">?</div>

            <h2>Forgot Password?</h2>

            <p class="forgot-description">
                Don't worry! Enter your registered email address
                to request assistance with resetting your password.
            </p>

            <form action="#" method="get">

                <div class="form-group">
                    <label for="reset-email">Registered Email Address</label>
                    <input
                        type="email"
                        id="reset-email"
                        name="reset_email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <button type="submit" class="btn">
                    Submit Request
                </button>

            </form>

            <p class="back-login">
                <a href="register.html">Register here</a>
            </p>

        </div>
    </div>

</body>
</html>
